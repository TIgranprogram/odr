name: odr

services:
  mongodb:
    image: mongo:7
    container_name: odr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Одноразовый сервис наполнения БД (идемпотентный seed: справочники,
  # заявки, склад + dev-админ admin/admin123). Завершается с кодом 0.
  seed:
    build:
      context: ./backend
    image: odr-backend:local
    container_name: odr-seed
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/kppdf
      SEED_DATA_DIR: /data/seed
    volumes:
      # CSV-выгрузки лежат в подпапке data/ (только чтение)
      - "./данные для заполнения на сайте/data:/data/seed:ro"
    command: ["node", "dist/scripts/seed.js"]

  backend:
    build:
      context: ./backend
    image: odr-backend:local
    container_name: odr-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      # API стартует только после успешного наполнения БД
      seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: mongodb://mongodb:27017/kppdf
      # Секреты лучше выносить в .env (см. .env.example)
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REFRESH_SECRET: ${REFRESH_SECRET:-change_me_refresh_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: odr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mongo-data:
