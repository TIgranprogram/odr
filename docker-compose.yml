name: odr

services:
  mongodb:
    image: mongo:7
    container_name: odr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: odr-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: mongodb://mongodb:27017/kppdf
      # Секреты лучше выносить в .env (см. .env.example)
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      # Путь к CSV-выгрузкам для seed-скрипта
      SEED_DATA_DIR: /data/seed
    volumes:
      # Выгрузки для первичного наполнения (только чтение)
      - "./данные для заполнения на сайте:/data/seed:ro"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: odr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mongo-data:
