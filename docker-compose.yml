version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: kppdf-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: kppdf-backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/kppdf
      - JWT_SECRET=your_secret_key_here
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: kppdf-frontend
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://localhost:3000
    depends_on:
      - backend
